name: Codex stylesheet cache bust

on:
  push:
    paths:
      - .github/workflows/codex-cache-bust.yml

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stylesheet links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "20260812-1"
          pattern = re.compile(r'href="style\.css(?:\?v=[^"]*)?"')

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = pattern.sub(f'href="style.css?v={version}"', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/codex-cache-bust.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html .github/workflows/codex-cache-bust.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bust stylesheet cache across pages"
            git push
          fi
