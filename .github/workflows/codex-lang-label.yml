name: Codex language label update

on:
  push:
    paths:
      - .github/workflows/codex-lang-label.yml

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update language label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('data-lang="ja">JA</span>', 'data-lang="ja">JP</span>')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/codex-lang-label.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html .github/workflows/codex-lang-label.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update language switch label to JP"
            git push
          fi
