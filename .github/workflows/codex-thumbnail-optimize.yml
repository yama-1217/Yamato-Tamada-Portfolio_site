name: Codex thumbnail optimization

on:
  push:
    paths:
      - .github/workflows/codex-thumbnail-optimize.yml

permissions:
  contents: write

jobs:
  optimize-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate thumbnails and update lists
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          sources = [
              'images/projects/2025_flowers_place/01.jpg',
              'images/projects/2025_heterogeneous_space/01.jpg',
              'images/projects/2025_murakami_distance/01.jpg',
              'images/projects/2024_hidden_body/01.jpg',
              'images/projects/2024_drifting_shin/01.jpg',
              'images/projects/2024_hidden_body_market/01.jpg',
              'images/projects/2024_growing_wall_hazi/01.jpg',
              'images/projects/2023_NewSign/01.jpg',
              'images/projects/2023_90_colas/01.jpg',
              'images/projects/2023_growing_wall/01.jpg',
              'images/projects/2023_restraining_protecting/01.jpg',
              'images/projects/2022_iron_and_salt/01.jpg',
          ]

          for src_name in sources:
              src = Path(src_name)
              dst = Path('images/thumbs') / src.relative_to('images/projects')
              dst.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as img:
                  img = img.convert('RGB')
                  img.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  img.save(dst, 'JPEG', quality=70, optimize=True, progressive=True)

          project_pattern = re.compile(r'images/projects/(2025_flowers_place|2025_heterogeneous_space|2025_murakami_distance|2024_hidden_body|2024_drifting_shin|2024_hidden_body_market|2024_growing_wall_hazi|2023_NewSign|2023_90_colas|2023_growing_wall|2023_restraining_protecting|2022_iron_and_salt)/01\.jpg')
          img_tag_pattern = re.compile(r'<img (?![^>]*\bloading=)')

          for html_name in ['index.html', 'works.html']:
              path = Path(html_name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('https://img.youtube.com/vi/fj7RttTYjqM/maxresdefault.jpg', 'https://img.youtube.com/vi/fj7RttTYjqM/hqdefault.jpg')
              text = project_pattern.sub(r'images/thumbs/\1/01.jpg', text)
              text = img_tag_pattern.sub('<img loading="lazy" decoding="async" ', text)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/codex-thumbnail-optimize.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html works.html images/thumbs .github/workflows/codex-thumbnail-optimize.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize works thumbnails"
            git push
          fi
